name: Build Panda Builder

on:
  push:
    paths:
      - "pandabuilder/**"
      - ".github/workflows/build-pandabuilder.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pandabuilder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pandabuilder-jar
          path: pandabuilder/build/libs/pandabuilder-*.jar
