name: Build Panda Builder

on:
  push:
    paths:
      - "pandabuilder/**"
      - ".github/workflows/build-pandabuilder.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pandabuilder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pandabuilder-jar
          path: pandabuilder/build/libs/pandabuilder-*.jar
      - name: Publish release with direct jar download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pandabuilder-build-${{ github.run_number }}
          name: Panda Builder build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Download pandabuilder-1.0.0.jar below and put it in .minecraft/mods (Minecraft 26.2, Fabric).
          files: pandabuilder/build/libs/pandabuilder-1.0.0.jar
